* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; }
body {

button { font: inherit; }
button:focus-visible { outline: 2px solid var(--gold-light); outline-offset: 3px; }

.app {

  width: 100%;
  height: 100vh;
  height: 100dvh;

.app::before, .app::after {

  border: 1px solid rgba(230,205,132,.17);
  will-change: transform;
}
.app::before {
  width: min(64vw, 780px);
  aspect-ratio: 1;
  right: -23vw;
  top: -48vh;

}

  left: -10vw;
  top: 24vh;
  animation: glowDrift 23s ease-in-out infinite alternate;

.gold-line {

  opacity: .9;
  z-index: 10;
}
.stage {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100%;
  display: grid;
  place-items: center;
  padding: clamp(22px, 4vh, 52px) clamp(14px, 4vw, 64px) 112px;
  perspective: 1400px;
}
.slide {
  width: min(1120px, 100%);

  overflow: auto;
  scrollbar-width: thin;
  scrollbar-color: rgba(217,189,114,.45) transparent;
  text-align: center;
  opacity: 1;
  transform: translate3d(0,0,0) scale(1);
  animation: slideEnter .92s cubic-bezier(.16,1,.3,1) both;
  will-change: opacity, transform, filter;
}
.slide.exit-next { animation: slideExitNext .24s ease-in both; }
.slide.exit-prev { animation: slideExitPrev .24s ease-in both; }
.eyebrow {
  margin-bottom: clamp(14px, 2.4vh, 25px);

  line-height: 1.5;
  font-weight: 800;
  letter-spacing: .24em;
  text-transform: uppercase;
}
h1, h2, p { margin-top: 0; }
h1 {

h2 {

  font-weight: 740;

}
.rule {

}
.rule::before, .rule::after {

.rule::after { transform: scaleX(-1); }
.bodycopy {

.card {

.btn {

.toast {

@keyframes atmosphere {

  50% { background-position: 75% 40%; }
  100% { background-position: 100% 80%; }
}
@keyframes ringFloatA {
  from { transform: translate3d(0,0,0) rotate(0deg); }
  to { transform: translate3d(-4vw,5vh,0) rotate(11deg); }
}
@keyframes ringFloatB {
  from { transform: translate3d(0,0,0) rotate(0deg); }
  to { transform: translate3d(5vw,-4vh,0) rotate(-9deg); }
}
@keyframes glowDrift {
  from { transform: translate3d(0,0,0) scale(.88); opacity: .55; }
  to { transform: translate3d(35vw,15vh,0) scale(1.18); opacity: .95; }
}
@keyframes slideEnter {
  0% { opacity: 0; transform: translate3d(48px,12px,0) scale(.975); filter: blur(9px); }

  100% { opacity: 1; transform: translate3d(0,0,0) scale(1); filter: blur(0); }
}
@keyframes slideExitNext {
  to { opacity: 0; transform: translate3d(-28px,0,0) scale(.99); filter: blur(5px); }
}
@keyframes slideExitPrev {
  to { opacity: 0; transform: translate3d(28px,0,0) scale(.99); filter: blur(5px); }

@media (prefers-reduced-motion: reduce) {

const stage = document.getElementById("stage");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const playBtn = document.getElementById("playBtn");
const toast = document.getElementById("toast");
let currentIndex = 0;
let transitioning = false;
let toastTimer;

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[ch]);
}

function showToast(message) {
  toast.textContent = message;
  toast.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.style.display = "none"; }, 4200);
}

function renderSlide(direction = "next") {
  const s = slides[currentIndex];
  let markup = "";

  if (s.type === "cover" || s.type === "section") {
    const isCover = s.type === "cover";
    markup = `
      <section class="slide ${isCover ? "cover" : "cover"}">
        <div class="brandline">${escapeHTML(s.brand || s.eyebrow || "Persatuan Wanita Patra")}</div>
        <h1>${escapeHTML(s.title)}</h1>
        <div class="rule">✦</div>
        <div class="subtitle">${escapeHTML(s.subtitle || "").replace(/\n/g, "<br>")}</div>
        ${s.period ? `<div class="period">${escapeHTML(s.period)}</div>` : ""}
        ${s.date ? `<div class="date">${escapeHTML(s.date)}</div>` : ""}
      </section>`;
  } else if (s.type === "video") {
    markup = `
      <section class="slide">
        <div class="eyebrow">${escapeHTML(s.eyebrow)}</div>
        <h2>${escapeHTML(s.title)}</h2>
        <div class="video-frame">
          <video id="mainVideo" controls playsinline preload="metadata">
            Browser Anda tidak mendukung pemutar video.
          </video>
          <div class="video-status" id="videoStatus"></div>
          ${s.note ? `<div class="video-note">${escapeHTML(s.note)}</div>` : ""}
        </div>
      </section>`;
  } else if (s.type === "greeting") {
    markup = `
      <section class="slide">
        <div class="eyebrow">${escapeHTML(s.eyebrow)}</div>
        <div class="card">
          <h1 style="font-size:clamp(1.8rem,4.4vw,3.8rem)">${escapeHTML(s.title)}</h1>
          <div class="rule">✦</div>
          <div class="bodycopy honorifics">${escapeHTML(s.body).split("\n").map(line => `<span>${line || "&nbsp;"}</span>`).join("")}</div>
        </div>
      </section>`;
  } else {
    const isPhoto = s.type === "photo";
    markup = `
      <section class="slide">
        <div class="eyebrow">${escapeHTML(s.eyebrow)}</div>
        <div class="card">
          <h1 style="font-size:clamp(1.8rem,4.4vw,3.9rem)">${escapeHTML(s.title)}</h1>
          <div class="rule">✦</div>
          <div class="bodycopy ${isPhoto ? "honorifics" : ""}">${isPhoto
            ? escapeHTML(s.body).split("\n").map(line => `<span>${line}</span>`).join("")
            : escapeHTML(s.body)}</div>
        </div>
      </section>`;
  }

  stage.innerHTML = markup;
  const newSlide = stage.querySelector(".slide");
  newSlide.style.animationName = "slideEnter";
  if (direction === "prev") {
    newSlide.style.transformOrigin = "right center";
  } else {
    newSlide.style.transformOrigin = "left center";
  }

  prevBtn.disabled = currentIndex === 0;
  nextBtn.textContent = currentIndex === slides.length - 1 ? "↻ Kembali ke Awal" : "Lanjut →";
  playBtn.style.display = s.type === "video" ? "inline-block" : "none";
  playBtn.textContent = "▶ Putar video";

  const video = document.getElementById("mainVideo");
  if (video) {
    const status = document.getElementById("videoStatus");
    video.src = new URL(s.src, window.location.href).href;

    video.addEventListener("loadstart", () => {
      status.style.display = "block";
      status.textContent = "Memuat video…";
    });
    video.addEventListener("canplay", () => { status.style.display = "none"; });
    video.addEventListener("playing", () => {
      status.style.display = "none";
      playBtn.textContent = "⏸ Jeda video";
    });
    video.addEventListener("pause", () => { playBtn.textContent = "▶ Putar video"; });
    video.addEventListener("ended", () => {
      showToast("Video selesai. Tekan Lanjut untuk meneruskan acara.");
    });
    video.addEventListener("error", () => {
      status.style.display = "block";
      const code = video.error ? video.error.code : 0;
      const errors = {
        2: "Video gagal dimuat karena masalah jaringan.",
        3: "Codec video tidak didukung oleh browser.",
        4: "File video tidak ditemukan atau formatnya tidak didukung."
      };
      status.textContent = (errors[code] || "Video tidak dapat diputar.") +
        " Pastikan file " + s.src + " ada di folder videos dan namanya benar.";
      showToast("Video tidak dapat dimuat. Periksa file di folder videos.");
    });
    video.load();
  }
}

function goToSlide(nextIndex, direction) {
  if (transitioning) return;
  if (nextIndex < 0 || nextIndex >= slides.length) return;

  transitioning = true;
  const oldSlide = stage.querySelector(".slide");
  const oldVideo = document.getElementById("mainVideo");

  if (oldVideo) {
    oldVideo.pause();
  }

  if (oldSlide) {
    oldSlide.classList.add(direction === "prev" ? "exit-prev" : "exit-next");
  }

  window.setTimeout(() => {
    if (oldVideo) {
      oldVideo.removeAttribute("src");
      oldVideo.load();
    }
    currentIndex = nextIndex;
    renderSlide(direction);
    window.setTimeout(() => { transitioning = false; }, 420);
  }, oldSlide ? 190 : 0);
}

prevBtn.addEventListener("click", () => {
  goToSlide(currentIndex - 1, "prev");
});

nextBtn.addEventListener("click", () => {
  if (currentIndex === slides.length - 1) {
    if (transitioning) return;
    transitioning = true;
    const oldSlide = stage.querySelector(".slide");
    if (oldSlide) oldSlide.classList.add("exit-prev");
    window.setTimeout(() => {
      currentIndex = 0;
      renderSlide("prev");
      showToast("Kembali ke awal acara.");
      window.setTimeout(() => { transitioning = false; }, 420);
    }, 190);
  } else {
    goToSlide(currentIndex + 1, "next");
  }
});

playBtn.addEventListener("click", async () => {
  const video = document.getElementById("mainVideo");
  if (!video) return;
  try {
    if (video.paused) await video.play();
    else video.pause();
  } catch (error) {
    showToast("Video belum siap. Tunggu sebentar, lalu tekan tombol putar di pemutar video.");
  }
});

document.getElementById("fullscreenBtn").addEventListener("click", async () => {
  try {
    if (!document.fullscreenElement) {
      await document.getElementById("app").requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
  } catch (error) {
    showToast("Layar penuh tidak tersedia pada browser ini.");
  }
});

document.addEventListener("keydown", event => {
  const tag = document.activeElement?.tagName;
  if (["INPUT", "TEXTAREA", "SELECT"].includes(tag)) return;

  if (event.key === "ArrowRight" || event.key === "PageDown") {
    event.preventDefault();
    if (currentIndex < slides.length - 1) goToSlide(currentIndex + 1, "next");
  } else if (event.key === "ArrowLeft" || event.key === "PageUp") {
    event.preventDefault();
    if (currentIndex > 0) goToSlide(currentIndex - 1, "prev");
  } else if (event.key.toLowerCase() === "f") {
    document.getElementById("fullscreenBtn").click();
  } else if (event.code === "Space" && slides[currentIndex].type === "video") {
    event.preventDefault();
    playBtn.click();
  } else if (event.key === "Home") {
    goToSlide(0, "prev");
  } else if (event.key === "End") {
    goToSlide(slides.length - 1, "next");
  }
});

let touchStartX = null;
stage.addEventListener("touchstart", event => {
  touchStartX = event.changedTouches[0].screenX;
}, { passive: true });
stage.addEventListener("touchend", event => {
  if (touchStartX === null) return;
  const delta = event.changedTouches[0].screenX - touchStartX;
  if (Math.abs(delta) > 70 && !transitioning) {
    if (delta < 0 && currentIndex < slides.length - 1) goToSlide(currentIndex + 1, "next");
    if (delta > 0 && currentIndex > 0) goToSlide(currentIndex - 1, "prev");
  }
  touchStartX = null;
}, { passive: true });

renderSlide();
</script>
